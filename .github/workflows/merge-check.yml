# Seeded as a real file because GitHub Actions does not discover symlinked
# workflows. Compile first: generated helpers must exist before checks run.
name: merge-check

on:
  pull_request:
    branches: [main]

jobs:
  merge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Build candidate gateway for ariadne source CI
        run: |
          set -euo pipefail
          # The source repo tests this change's CLI before it is published.
          # Consumer repos use the published formula through bootstrap.sh,
          # or a source-built candidate while the tap is unpublished (#250).
          if [ -f go.mod ] && grep -Eq '^module[[:space:]]+github.com/xianxu/ariadne[[:space:]]*$' go.mod; then
            brew bundle --file=Brewfile
            mkdir -p "$RUNNER_TEMP/weave-candidate"
            go build -o "$RUNNER_TEMP/weave-candidate/weave" ./cmd/weave
            echo "$RUNNER_TEMP/weave-candidate" >> "$GITHUB_PATH"
          elif ! brew tap xianxu/ariadne; then
            # Until #241 publishes the tap, consumers build the same candidate
            # from ariadne's public source; the branch goes dormant after.
            echo "::warning::Homebrew tap xianxu/ariadne is not published yet (#241); building weave from ariadne source"
            src="$RUNNER_TEMP/ariadne-source"
            git clone --depth 1 https://github.com/xianxu/ariadne.git "$src"
            brew bundle --file="$src/Brewfile"
            mkdir -p "$RUNNER_TEMP/weave-candidate"
            (cd "$src" && go build -o "$RUNNER_TEMP/weave-candidate/weave" ./cmd/weave)
            echo "$RUNNER_TEMP/weave-candidate" >> "$GITHUB_PATH"
          fi
      - name: Prepare dependencies and compile composition
        run: |
          set -euo pipefail
          ./bootstrap.sh
      - name: Set up repository checks
        run: |
          set -euo pipefail
          if [ -x scripts/ci-setup.sh ]; then
            ./scripts/ci-setup.sh
          fi
      - name: Run merge-checks over the PR range
        run: |
          set -euo pipefail
          base_tip="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          base="$(git merge-base "$base_tip" "$head")"
          bash scripts/run-merge-checks.sh "$base" "$head"
