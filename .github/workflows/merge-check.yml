# Seeded as a real file because GitHub Actions does not discover symlinked
# workflows. Compile first: generated helpers must exist before checks run.
name: merge-check

on:
  pull_request:
    branches: [main]
  # #309: main carries a CI status too; a push run checks before..after.
  push:
    branches: [main]

jobs:
  merge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Build candidate gateway for ariadne source CI
        run: |
          set -euo pipefail
          # The source repo tests this change's CLI before it is published.
          # Consumer repos install the published formula through bootstrap.sh.
          if [ -f go.mod ] && grep -Eq '^module[[:space:]]+github.com/xianxu/ariadne[[:space:]]*$' go.mod; then
            brew bundle --file=Brewfile
            mkdir -p "$RUNNER_TEMP/weave-candidate"
            go build -o "$RUNNER_TEMP/weave-candidate/weave" ./cmd/weave
            echo "$RUNNER_TEMP/weave-candidate" >> "$GITHUB_PATH"
          fi
      - name: Prepare dependencies and compile composition
        run: |
          set -euo pipefail
          ./bootstrap.sh
      - name: Set up repository checks
        run: |
          set -euo pipefail
          if [ -x scripts/ci-setup.sh ]; then
            ./scripts/ci-setup.sh
          fi
      - name: Run merge-checks over the change range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            base_tip="$PUSH_BEFORE"
            head="$PUSH_AFTER"
            # A new ref has an all-zero before: nothing to compare against.
            case "$base_tip" in
              *[!0]*) ;;
              *) echo "merge-check: push without a previous main, nothing to compare"; exit 0 ;;
            esac
          else
            base_tip="$PR_BASE"
            head="$PR_HEAD"
          fi
          base="$(git merge-base "$base_tip" "$head")"
          bash scripts/run-merge-checks.sh "$base" "$head"
